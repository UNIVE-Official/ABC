[package]
name = "lyrion"
version = "0.2.4" # Production Ready – 22 novembre 2025 23:47 UTC
edition = "2021"
[features]
default = []
gui = ["chacha20poly1305", "eframe", "egui", "image", "poll-promise", "qrcode", "argon2"]
[dependencies]
anyhow = "1.0.86"
async-trait = "0.1.80"
num_cpus = "1.16.0"
clap = { version = "4.5.4", features = ["derive"] }
config = "0.14.0"
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
num-bigint = "0.4.6"
num-traits = "0.2.19"
once_cell = "1.19.0"
rocksdb = { version = "0.22.0", features = ["multi-threaded-cf", "snappy"] }
secp256k1 = "0.29.1"
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.8"
ripemd = "0.2.0-rc.3"
thiserror = "1.0.61"
tokio = { version = "1.38.0", features = ["full"] }
zeroize = "1.8.1"
base58check = "0.1.0"
bincode = "1.3.3"
parking_lot = "0.12.3"
rayon = "1.10.0"
governor = "0.6.1"
dashmap = { version = "6.0.1", features = ["rayon", "raw-api"] }
tokio-util = "0.7.11"
actix-web = "4.8.0"
prometheus = "0.13.4"
randomx-rs = "1.2.2"
monero-serai-mirror = "0.1.5-alpha"
hex = "0.4.3"
nonzero_ext = "0.3.0"
backtrace = "0.3.69"
ed25519-dalek = "2.1.1"
zip = "2.1.3"
lru = "0.12.3"
tokio-metrics = "0.3.1"
deadpool = { version = "0.12.3", features = ["managed", "rt_tokio_1"] }
libp2p = { version = "0.53.2", features = ["tcp", "noise", "yamux", "identify", "ping", "mdns"] }
bulletproofs = "4.0.0"
retry = "2.0.0"
nix = "0.29.0"
digest = "0.10.7"
scopeguard = "1.2.0"
secrecy = "0.8.0"
mimalloc = { version = "0.1.39", default-features = false }
ahash = "0.8.11"
libc = "0.2.155"
ring = "0.17.8"
bip39 = { version = "2.0.0", features = ["rand"] }
bitcoin = { version = "0.31.2", features = ["rand-std", "serde"] }
rand = "0.8.5"
dirs = "5.0.1"
reqwest = { version = "0.12.5", features = ["json"] }
jsonwebtoken = "9"
itertools = "0.13.0"
argon2 = { version = "0.5.3", optional = true }
chacha20poly1305 = { version = "0.10.1", optional = true }
eframe = { version = "0.28.1", optional = true }
egui = { version = "0.28.1", optional = true }
image = { version = "0.25.2", optional = true }
poll-promise = { version = "0.3.0", optional = true }
qrcode = { version = "0.14.0", optional = true }
[dev-dependencies]
proptest = "1.5.0"
tokio-test = "0.4.4"
criterion = "0.5.1"
[profile.release]
panic = "abort"
lto = "fat"
codegen-units = 1
opt-level = 3 # ← maximum speed for RandomX + validation
strip = true
